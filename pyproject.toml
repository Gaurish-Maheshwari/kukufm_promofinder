[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kuku-promo-finder"
version = "1.0.0"
description = "Find ready-to-cut promos (hook in 3 s, cliffhanger ending) in microdrama screenplays."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "pydantic>=2.6",
  "PyYAML>=6.0", "httpx>=0.27", "pypdf>=4.0", "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pdfplumber>=0.11", "openpyxl>=3.1", "reportlab>=4.0", "matplotlib>=3.8"]

[project.scripts]
promo-finder = "promo_engine.cli:main"

[tool.setuptools.packages.find]
include = ["promo_engine*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
